:root{--paper:#FBF4EA;--ink:#22263A;--soft:#6A6A77;--press:#E8524F;--navy:#2B3A67;--rule:#E3D6C3}

*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:18px/1.75 Charter,"Iowan Old Style","Palatino Linotype",Georgia,serif}
a{color:var(--navy)}
.col{max-width:36rem;margin:0 auto;padding:0 20px}
header{padding:34px 0 8px;text-align:center}

h1{font-weight:400;font-size:clamp(32px,7vw,46px);line-height:1.12;text-align:center;margin:30px 0 6px}
.stamp{text-align:center;color:var(--soft);font:italic 15px Georgia,serif;margin:0 0 30px}
h2{font-weight:400;font-style:italic;font-size:24px;line-height:1.3;margin:42px 0 8px}
h2:before{content:"\2766";color:var(--press);font-style:normal;margin-right:10px;font-size:20px}
p{margin:0 0 16px}
ul{padding-left:22px;margin:0 0 16px}li{margin:0 0 6px}
.pull{border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:16px 4px;margin:0 0 8px;font-size:20px;text-align:center}
code{font:15px ui-monospace,Menlo,monospace;background:color-mix(in srgb,var(--rule) 60%,transparent);padding:1px 6px;border-radius:4px}
footer{text-align:center;color:var(--soft);font:13px -apple-system,Arial,sans-serif;padding:50px 20px 40px}

</style>
